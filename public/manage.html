<div class="wrap">

<p class="kicker">Your signup</p>

<p class="lede" id="summary">Loading…</p>

<div class="stack">
<button class="btn" type="button" id="push-on">Turn on push for this device</button>
<button class="btn btn-ghost" type="button" id="email-off">Stop email</button>
<button class="btn btn-ghost" type="button" id="push-off">Stop push</button>

<button class="texty" type="button" id="remove">Remove me completely</button>
